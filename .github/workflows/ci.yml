name: Versaly Core CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Run build check
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/versaly_test?schema=public"
          AUTH_SECRET: "ci_pipeline_secret_key_testing_min_32_characters_long"
          NODE_ENV: "production"
