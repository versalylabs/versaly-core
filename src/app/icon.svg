<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="vIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="vCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="vBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="vGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#6366f1" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container tile with rounded corners and glowing border -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#vBg)" stroke="url(#vBorder)" stroke-width="2" />

  <!-- Inner ambient glow -->
  <circle cx="32" cy="30" r="18" fill="#6366f1" opacity="0.15" filter="blur(6px)" />

  <!-- Layered Isometric Wings (Versaly "V" + Architecture Layers) -->
  <g filter="url(#vGlow)">
    <!-- Base Layer (Depth) -->
    <path d="M14 18 L24 18 L32 38 L40 18 L50 18 L34 46 L30 46 Z" fill="url(#vIndigo)" opacity="0.35" />

    <!-- Left Wing (Top Layer) -->
    <path d="M14 17 L23 17 L32 39 L25 39 Z" fill="url(#vIndigo)" />

    <!-- Right Wing (Top Layer) -->
    <path d="M50 17 L41 17 L32 39 L37 39 Z" fill="url(#vIndigo)" />

    <!-- Isometric Cross-tier (Left) -->
    <polygon points="21,27 28,27 32,35 25,35" fill="#818cf8" opacity="0.9" />

    <!-- Isometric Cross-tier (Right) -->
    <polygon points="43,27 36,27 32,35 39,35" fill="#a78bfa" opacity="0.9" />

    <!-- Central Core Jewel (Cyan Accent) -->
    <polygon points="32,22 36,29 32,36 28,29" fill="url(#vCyan)" />

    <!-- Bottom Apex Notch -->
    <polygon points="28,40 36,40 32,47" fill="#c084fc" />
  </g>
</svg>
